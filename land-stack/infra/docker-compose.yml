version: "3.9"
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: landstack
      POSTGRES_USER: landstack
      POSTGRES_PASSWORD: landstack
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../seed-data:/docker-entrypoint-initdb.d

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    environment:
      DATABASE_URL: postgres://landstack:landstack@postgres:5432/landstack
    ports: ["7800:7800"]
    depends_on: [postgres]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: landstack
      MINIO_ROOT_PASSWORD: landstack123
    ports: ["9000:9000", "9001:9001"]

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg2://landstack:landstack@postgres:5432/landstack
      REDIS_URL: redis://redis:6379
      JWT_SECRET: devsecret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: landstack
      MINIO_SECRET_KEY: landstack123
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ../frontend
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
